name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  OPSCHAIN_VERSION: v5.6.1

jobs:
  # Exercise the action end to end: scaffold an example repository with
  # `opschain init` and run its `hello` action on the local lane — no
  # server, no credentials, nothing reached over the network but the
  # release download.
  example:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install opschain for the scaffold step
        env:
          OPSCHAIN_RELEASES_TOKEN: ${{ secrets.OPSCHAIN_RELEASES_TOKEN }}
        run: |
          bash scripts/install.sh "${OPSCHAIN_VERSION}" "${RUNNER_TEMP}/opschain-bin"
          echo "${RUNNER_TEMP}/opschain-bin" >> "${GITHUB_PATH}"

      # `opschain init` scaffolds a project with one `hello` action; the
      # example repository is created here rather than checked out, so the
      # workflow needs nothing beyond the release download.
      - name: Scaffold the example repository
        run: |
          mkdir example && cd example
          git init -q -b main
          opschain init
          git add -A
          git -c user.name=ci -c user.email=ci@example.invalid commit -q -m "scaffold"

      - name: Run hello off the working copy
        id: tree
        uses: ./
        with:
          version: ${{ env.OPSCHAIN_VERSION }}
          download-token: ${{ secrets.OPSCHAIN_RELEASES_TOKEN }}
          action: hello
          env: dev
          working-directory: example
          artifact-name: opschain-artifacts-${{ matrix.os }}-tree

      - name: Run hello pinned to the scaffold commit
        id: pinned
        uses: ./
        with:
          version: ${{ env.OPSCHAIN_VERSION }}
          download-token: ${{ secrets.OPSCHAIN_RELEASES_TOKEN }}
          action: hello
          env: dev
          ref: HEAD
          working-directory: example
          artifact-name: opschain-artifacts-${{ matrix.os }}-pinned

      - name: Assert the outputs
        env:
          TREE_STATUS: ${{ steps.tree.outputs.status }}
          TREE_EXIT: ${{ steps.tree.outputs.exit-code }}
          PINNED_COMMIT: ${{ steps.pinned.outputs.commit }}
          PINNED_DOC: ${{ steps.pinned.outputs.run-document }}
        run: |
          test "${TREE_STATUS}" = "success"
          test "${TREE_EXIT}" = "0"
          test -n "${PINNED_COMMIT}"
          printf '%s' "${PINNED_DOC}" | jq -e '.failed == false and .cancelled == false and .timed_out == false' > /dev/null

  # A usage error must surface as exit code 2 without failing the install.
  usage-error:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: bad
        continue-on-error: true
        uses: ./
        with:
          version: ${{ env.OPSCHAIN_VERSION }}
          download-token: ${{ secrets.OPSCHAIN_RELEASES_TOKEN }}
          action: hello
          workflow: nightly
          env: dev
          artifacts: "false"
      - env:
          EXIT: ${{ steps.bad.outputs.exit-code }}
        run: test "${EXIT}" = "2"
