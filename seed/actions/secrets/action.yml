name: OpsChain secrets
description: >-
  Resolve secret-vault:// references and deliver them as MASKED
  environment variables — ::add-mask:: is registered by the action, never
  left to the workflow author, and values are never step outputs. Needs
  the env setup-opschain exports; resolution follows the exchanged
  token's service identity.
inputs:
  secrets:
    description: |
      Newline-separated NAME=secret-vault://path/key pairs, e.g.
        DB_PASSWORD=secret-vault://payments/prod/db_password
        API_KEY=secret-vault://payments/prod/api_key
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        while IFS= read -r line; do
          [ -z "$line" ] && continue
          NAME=${line%%=*}
          REF=${line#*=}
          RESPONSE=$(curl -sS --fail-with-body -X POST \
            "$OPSCHAIN_SERVER_URL/api/v2/opschain.api.v2.SecretService/ResolveGlobalSecret" \
            -H "Authorization: Bearer $OPSCHAIN_TOKEN" -H 'Content-Type: application/json' \
            -d "$(jq -n --arg r "$REF" '{vault_path:$r}')")
          VALUE=$(echo "$RESPONSE" | jq -r '.result.result')
          case "$VALUE" in
            ""|null|ERROR:*)
              echo "resolving $NAME from $REF failed: ${VALUE:-empty answer}" >&2
              exit 1
              ;;
          esac
          echo "::add-mask::$VALUE"
          echo "$NAME=$VALUE" >> "$GITHUB_ENV"
          echo "Resolved $NAME (masked)"
        done <<< "${{ inputs.secrets }}"
